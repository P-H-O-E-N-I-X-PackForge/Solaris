modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"
issueTrackerURL="https://github.com/Omicron-Industries/Solaris/issues" #optional

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    mixinConfigs = "solaris.mixins.json"
    displayURL = "${mod_url}"
    authors="${mod_author}"
    description = '''
 A Phoenix-original map mod seeking to be beautiful, easy to use, and an owner of good api.
 Has compat for xtones, create copycat blocks, PhoenixWiki, and phoenix guilds.
'''

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtceu"
        mandatory = false
        versionRange = "[0,)"
        ordering = "AFTER"
        side = "CLIENT"
    [[dependencies.${mod_id}]]
        modId = "phoenix_guilds"
        mandatory = false
        versionRange = "[0,)"
        ordering = "AFTER"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "framedblocks"
        mandatory = false
        versionRange = "[0,)"
        ordering = "AFTER"
        side = "CLIENT"
    [[dependencies.${mod_id}]]
        modId = "copycats"
        mandatory = false
        versionRange = "[0,)"
        ordering = "AFTER"
        side = "CLIENT"
    [[dependencies.${mod_id}]]
        modId = "domum_ornamentum"
        mandatory = false
        versionRange = "[0,)"
        ordering = "AFTER"
        side = "CLIENT"
    [[dependencies.${mod_id}]]
        modId="phoenix_wiki"
        mandatory=true
        versionRange="[0.4.7,)"
        ordering="NONE"
        side="BOTH"
