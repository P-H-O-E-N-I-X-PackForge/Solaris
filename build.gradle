plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Devos Snapshot Maven'
        url = 'https://mvn.devos.one/snapshots/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'Architectury Maven'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'LatvianDev Maven'
        url = 'https://maven.latvian.dev/releases/'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'Create Maven'
        url = 'https://maven.createmod.net/'
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/"
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'TheIllusiveC4 Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Repsy Toma Maven'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    maven {
        name = 'LDTTeam Maven'
        url = 'https://ldtteam.jfrog.io/ldtteam/mods-maven'
        content {
            includeGroup 'com.ldtteam'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://maven.modmaven.dev/'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "cursemaven"
        }
    }
    maven {
        name = "Repsy"
        url = uri("https://repo.repsy.io/mvn/user75142941/phoenixsuite")
    }
}

base {
    archivesName = 'solaris-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--username', 'Phoenixvine'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client2 {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll '--username', 'Dev2'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client3 {
            client()
            gameDirectory = project.file('run/client3')
            programArguments.addAll '--username', 'Dev3'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Exclude standalone Mixin to avoid conflicts with NeoForge's internal system
configurations.configureEach {
    exclude group: 'org.spongepowered', module: 'mixin'
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    // Lombok & Annotations
    implementation "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"
    compileOnly "org.jetbrains:annotations:26.0.2"

    // Core Registrate & Phoenix Suite
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "net.phoenixvine.wiki:neoforge:0.6.0"
    implementation("net.phoenixvine.guilds:phoenix-guilds-neoforge:1.6.9")

    compileOnly("curse.maven:domum-ornamentum-527361:8784713")
    localRuntime("curse.maven:domum-ornamentum-527361:8784713")

    compileOnly("curse.maven:framedblocks-441647:9137677")
    localRuntime("curse.maven:framedblocks-441647:9137677")

    compileOnly("curse.maven:framedblocks-441647:9137677")
    localRuntime("curse.maven:framedblocks-441647:9137677")

    compileOnly("curse.maven:kubejs-238086:8843626")
    compileOnly("curse.maven:rhino-416294:8463898")

    // Optional integrations (compile-only; the mods are not required at runtime)
    compileOnly("curse.maven:create-kinetic-waypoints-1610005:8753462")
    compileOnly("curse.maven:waystones-245755:8969751")




    // Core Integrations
    implementation "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}"
    implementation "brachy.modularui:modularui-mc${minecraft_version}:${mui_version}"
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}


tasks.register('publishToDomains', Copy) {
    group = 'phoenix'
    dependsOn tasks.named('jar')
    description = 'Builds this mod and copies the jar into ../Phoenix-Domains/libs, so Domains picks up local changes.'
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into '../Phoenix-Domains/libs'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "Repsy"
            url = uri("https://repo.repsy.io/mvn/user75142941/phoenixsuite")
            credentials {
                username = project.findProperty("repsyUsername") ?: System.getenv("REPSY_USERNAME")
                password = project.findProperty("repsyPassword") ?: System.getenv("REPSY_PASSWORD")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
